[main]
font=Iosevka Term:size=11
pad=12x10
# Selecting text copies it to the clipboard too, not only to middle-click paste.
selection-target=both

# Dark academia palette; same values as quickshell/Theme.qml.
[colors]
foreground=ebdfca
background=241d18
selection-foreground=ebdfca
selection-background=54453a
cursor=241d18 c9a46a
urls=c9a46a
regular0=3d3129
regular1=b0645a
regular2=9ea67e
regular3=d6ac63
regular4=8b9eab
regular5=ab8fa3
regular6=8eaa9e
regular7=c9b89f
bright0=6b5a4c
bright1=c98073
bright2=b3bb95
bright3=e3c07e
bright4=a3b4bf
bright5=c1a7b9
bright6=a6c0b5
bright7=ebdfca

# Needs the shell's OSC 133 marks (~/.bashrc): Ctrl+Shift+G copies the last command's output.
# Ctrl+Shift+Z/X (jump between prompts) and Ctrl+Shift+N (new terminal in this directory) are
# foot's defaults.
[key-bindings]
pipe-command-output=[wl-copy] Control+Shift+g
