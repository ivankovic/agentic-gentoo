# aerc on deck (hosts/deck/email.md). Accounts: accounts.conf, written by `deck-mail config`
# (addresses stay off the repo); the "All" tab's searches: all.map. Keys: aerc's defaults
# (/usr/share/aerc/binds.conf).

[ui]
threading-enabled = true
timestamp-format = 2006-01-02 15:04
this-day-time-format = 15:04
this-year-time-format = Jan 02 15:04
mouse-enabled = true
# A column for the tags worth seeing (deleted, lists, ...); the everyday ones show as flags.
index-columns = flags:4,name<20%,subject,tags>=,date>=
column-tags = {{map .Labels (exclude `^(inbox|unread|replied|passed|flagged|sent|draft|attachment|signed|encrypted)$`) | join " "}}

[viewer]
# Plain text first. A newsletter whose text part is only a "read it online" placeholder: Ctrl-J
# to its HTML part.
alternatives = text/plain,text/html

[compose]
editor = nvim
# Replies from the address the mail came to.
reply-to-self = false
empty-subject-warning = true
no-attachment-warning = ^[^>]*\battach(ed|ment)?\b

[filters]
text/plain = colorize
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize
# w3m as text, no network (aerc's html filter). Links as [n] beside their text, the addresses
# listed at the end; Ctrl-L opens one, o the whole mail in Firefox.
text/html = html -o display_link_number=true
# No image/* filter: aerc's own terminal shows pictures itself, as sixel in foot.
.headers = colorize

[openers]
# Firefox is firefox-bin here. A copy in the runtime folder (gone at logout), since a running
# Firefox opens the file after this command has returned and aerc may have removed its own.
text/html = f=$(mktemp -p "$XDG_RUNTIME_DIR" aerc-XXXXXX.html) && cp {} "$f" && firefox-bin "$f"
x-scheme-handler/http* = firefox-bin
image/* = imv
application/pdf = zathura
