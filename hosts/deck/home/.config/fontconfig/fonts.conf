<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Iosevka everywhere; icons from Symbols Nerd Font; Noto fills any gaps. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Iosevka</family><family>Symbols Nerd Font</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Iosevka</family><family>Symbols Nerd Font</family><family>Noto Serif</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Iosevka Term</family><family>Symbols Nerd Font</family><family>Noto Sans Mono</family><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
