# niri's portals.conf (/usr/share/xdg-desktop-portal/niri-portals.conf), which this file replaces
# whole, plus FileChooser from gtk: gnome's file chooser delegates to Nautilus, which isn't
# installed, so Firefox's file dialogs silently never opened.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
