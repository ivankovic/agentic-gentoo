# niri, the compositor, built for this CPU and with whole-program LTO (its release profile has thin
# LTO, opt-level 3 and overflow checks, which stay). No debug info: rebuild with
# FEATURES=splitdebug to profile it (README, "Profiling").
RUSTFLAGS="${RUSTFLAGS} -C target-cpu=native"
CARGO_PROFILE_RELEASE_LTO=fat
CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
CARGO_PROFILE_RELEASE_DEBUG=false
