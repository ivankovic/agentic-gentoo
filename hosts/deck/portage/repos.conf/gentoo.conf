# The Gentoo repository by git from gentoo-mirror (metadata cache, GLSAs and news included), each
# commit's signature checked against the Gentoo release key, instead of the rsync rotation: one
# rsync mirror served a tree with a stray file (lastreplicate) that fails Manifest verification,
# and the rotation kept drawing it (4 of 10 nights, 2026-10-25 to 11-03). Shallow: history isn't
# needed. Switching once: sudo mv /var/db/repos/gentoo /var/db/repos/gentoo.rsync; emerge --sync.
[gentoo]
location = /var/db/repos/gentoo
sync-type = git
sync-uri = https://github.com/gentoo-mirror/gentoo.git
sync-depth = 1
sync-git-verify-commit-signature = yes
sync-openpgp-key-package = sec-keys/openpgp-keys-gentoo-release
auto-sync = yes
