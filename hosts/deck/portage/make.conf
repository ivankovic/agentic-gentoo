COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

MAKEOPTS="-j20 -l18"
# --with-bdeps=y: keep the build tools of binary packages installed and updated too, so any
# package can be patched and rebuilt from source.
EMERGE_DEFAULT_OPTS="--jobs=3 --load-average=18 --binpkg-respect-use=y --with-bdeps=y"

FEATURES="getbinpkg binpkg-request-signature parallel-fetch"

# Source builds yield to the desktop: lowest CPU priority short of idle, idle I/O.
PORTAGE_NICENESS="10"
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"

ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"

USE="wayland vaapi vulkan bluetooth networkmanager dist-kernel -gnome -kde -qt5"

VIDEO_CARDS="intel"
INPUT_DEVICES="libinput"

L10N="en de de-CH hr"

LC_MESSAGES=C.UTF-8
