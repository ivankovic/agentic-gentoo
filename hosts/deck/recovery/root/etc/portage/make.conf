# Deck recovery: a small console Gentoo. Same binhost as the main system (x86-64-v3), so updates
# mostly download; anything built from source is built for this CPU's generation.
COMMON_FLAGS="-march=x86-64-v3 -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
MAKEOPTS="-j16 -l16"
EMERGE_DEFAULT_OPTS="--jobs=3 --load-average=16 --binpkg-respect-use=y"
FEATURES="getbinpkg binpkg-request-signature parallel-fetch"
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"
# No desktop: console only.
USE="-X -wayland -gtk -qt5 -qt6 -gui -bluetooth -pulseaudio -alsa dist-kernel"
L10N="en"
LC_MESSAGES=C.UTF-8
# The kernel's own install hook isn't used here (installkernel without dracut/uki; update.sh builds
# deck-recovery.efi), so don't insist on /efi being mounted when the kernel package is installed.
DONT_MOUNT_BOOT="1"
