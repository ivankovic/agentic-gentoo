# A generic (not host-only) initramfs built inside systemd-nspawn, with only what unlocking and
# mounting the recovery partition needs: dm-crypt, ext4 (built in), the keyboard (i8042 and atkbd
# are built in; USB for an external one). No graphics drivers: the console stays on the firmware's
# framebuffer. The kernel command line (rd.luks.name=<p3 UUID>=recovery ...) is written by
# recovery/install.sh to 90-cmdline.conf once the partition exists.
hostonly="no"
add_dracutmodules+=" crypt systemd "
omit_dracutmodules+=" plymouth network network-manager nfs iscsi nbd lvm mdraid multipath btrfs "
drivers="dm_crypt dm_mod xhci_pci xhci_hcd usbhid hid_generic"
early_microcode="yes"
compress="zstd"
