# i915 wait-boost at 300 MHz (RP1) instead of 1500, the maximum: a program waiting on the GPU no
# longer sends it straight to full speed; it reaches 1500 only through GuC SLPC's own ramp under
# load. The resets in Firefox stopped with this in force (README, GPU ramp test).
w /sys/class/drm/card0/gt_boost_freq_mhz - - - - 300
