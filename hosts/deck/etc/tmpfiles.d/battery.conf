w /sys/class/power_supply/BAT0/charge_control_start_threshold - - - - 75
w /sys/class/power_supply/BAT0/charge_control_end_threshold - - - - 80
# wheel may lift the limit for one full charge (Mod+D, Battery.qml); the next boot restores 75/80.
z /sys/class/power_supply/BAT0/charge_control_start_threshold 0664 root wheel -
z /sys/class/power_supply/BAT0/charge_control_end_threshold 0664 root wheel -
