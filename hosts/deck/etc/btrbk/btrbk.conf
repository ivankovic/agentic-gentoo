# Local snapshots of / and /home, hourly (systemd/system/btrbk.timer.d/hourly.conf).
# They live on the same disk: they undo mistakes and bad updates, they are not a backup.
# Browse them in /.snapshots (@snapshots); restore a file by copying it back.

timestamp_format        long
snapshot_preserve_min   2d
snapshot_preserve       48h 14d 6w 3m

# The btrfs top level, automounted (etc/fstab), so btrbk sees @, @home and @snapshots side by side.
# @var_log and @var_tmp are left out on purpose.
volume /mnt/btr_pool
  snapshot_dir @snapshots
  subvolume @
  subvolume @home
