# Leave the last splash frame on screen when Plymouth quits. fbcon takes the console over lazily
# (CONFIG_FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER), so without this the framebuffer falls back to
# what the firmware drew, the Lenovo logo, until greetd switches to tuigreet's VT.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
