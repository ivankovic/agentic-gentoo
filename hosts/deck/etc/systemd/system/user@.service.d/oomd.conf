# When everything in the desktop session spends over half its time stalled on memory for 20 s
# (oomd.conf.d/deck.conf), systemd-oomd kills the cgroup inside it reclaiming the most: a terminal
# with a runaway build, a browser, a container. Terminals and apps get their own scopes (niri's
# Mod+T, quickshell's launcher), and niri, quickshell and PipeWire ask to be spared
# (~/.config/systemd/user/*.service.d/oomd.conf).
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
