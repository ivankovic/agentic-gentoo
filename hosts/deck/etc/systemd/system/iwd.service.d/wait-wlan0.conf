[Unit]
# With DefaultInterface=* (iwd/main.conf) iwd looks for the kernel's wlan0 once, at startup, and
# never again. Start it only after udev has finished with wlan0; on 2026-10-09 it looked 0.3 s
# too early ("No default interface for wiphy 0") and Wi-Fi stayed down for the whole boot.
# Wants, not Requires: if wlan0 never appears, iwd still starts after the device timeout.
Wants=sys-subsystem-net-devices-wlan0.device
After=sys-subsystem-net-devices-wlan0.device
