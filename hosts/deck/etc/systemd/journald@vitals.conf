# The "vitals" journal namespace (deck-vitals.service): its own files, kept about four days.
# SyncIntervalSec is short so the last lines before a sudden reset reach the disk; journald marks
# its files no-copy-on-write on btrfs, so each sync is a small data write.
[Journal]
Storage=persistent
Compress=yes
SyncIntervalSec=2s
MaxRetentionSec=4day
SystemMaxUse=256M
RateLimitIntervalSec=0
ForwardToSyslog=no
ForwardToWall=no
