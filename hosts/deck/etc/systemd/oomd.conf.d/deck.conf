# systemd-oomd (enabled with systemctl enable --now systemd-oomd.service): kills the runaway cgroup
# before the machine thrashes to a standstill. What it watches is set per unit: user@.service.d
# (memory pressure in the desktop session) and -.slice.d (swap nearly full, system-wide).
# A kill is logged: journalctl -u systemd-oomd.
[OOM]
# Pressure has to hold this long before a kill (default 30 s): long enough for a link step to finish,
# short enough that the desktop never freezes for minutes.
DefaultMemoryPressureDurationSec=20s
