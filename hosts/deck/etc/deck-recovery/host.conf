# This machine's recovery system (recovery/, etc/deck-recovery/): what differs from host to host.
# Read by build.sh, install.sh, update.sh and refresh.sh; update.sh copies it into the recovery as
# /etc/deck-recovery.conf, where deck mount, deck chroot, deck rollback and the login help read it.

# Its name: the systemd-boot menu title and the login banner.
RECOVERY_NAME="Deck recovery"
# Its partition's GPT name, also its LUKS and ext4 label, its hostname and its UKI's file name.
RECOVERY_LABEL=deck-recovery
# The main system's LUKS partition, and its dm-crypt name (and /mnt/<name>) in the recovery.
MAIN_LUKS=/dev/disk/by-uuid/9e6393f4-5800-4971-aa10-aa2ea004c044
MAIN_NAME=deck
# The ESP, shared with the main system.
ESP_UUID=0E9D-1398
# wifi: iwd, with the main system's saved networks. wired: DHCP on every en* interface.
NETWORK=wifi
# yes: unlock over SSH (dropbear in its initramfs) and sshd in the recovery, both on port 2222 with
# the main system's initramfs host key and allowed keys (/etc/dropbear, dracut-crypt-ssh). no: the
# console only.
SSH=no
# More kernel modules for its initramfs, which carries only what it needs (a wired NIC for SSH).
INITRD_DRIVERS=""
