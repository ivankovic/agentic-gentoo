# Swap is zram only (etc/systemd/zram-generator.conf): compressed RAM, far cheaper to swap to than
# re-reading files from disk. So swap idle program memory before dropping the file cache
# (swappiness above 100 says swap is cheaper than file I/O), and read one page at a time, since
# zram has no seek cost to amortise (page-cluster 0). The usual zram settings: ArchWiki "Zram",
# Fedora, Pop!_OS.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
