# Ignore ICMP redirects and don't send them: a laptop is not a router, and a redirect from
# anyone on a shared network could otherwise reroute traffic. The globs reach existing
# interfaces too; systemd-sysctl applies them to new ones as they appear.
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
net.ipv4.conf.*.send_redirects = 0
net.ipv6.conf.*.accept_redirects = 0

# Hide kernel addresses from unprivileged users (they help exploits defeat KASLR).
kernel.kptr_restrict = 1
# No loading a new kernel with kexec; nothing here uses kdump.
kernel.kexec_load_disabled = 1
# Don't load line-discipline modules on demand for unprivileged users (old exploit vector).
dev.tty.ldisc_autoload = 0
# No core dumps from setuid programs (overrides 50-coredump.conf's 2).
fs.suid_dumpable = 0
