category = "boot"
task = [
  "On the last boot the machine waited a minute and a half for a disk and then dropped into emergency mode. I removed the old data disk last week. Make sure it boots normally.",
  "I took out the disk that was mounted on ${MP}. Now booting hangs waiting for it. Fix the boot.",
  "Boot gets stuck on 'A start job is running for /dev/...' and then emergency mode. I recently pulled out a disk. Fix it.",
]
reboot_before_check = true

[vars]
MP = ["/data", "/mnt/backup", "/srv/media", "/home/archive"]
SPEC = ["UUID=6b1c6a1e-3f0a-4c55-9d7e-1f2a3b4c5d6e", "LABEL=backup", "/dev/vdb1", "UUID=1e0e8a49-77d2-4f0c-9b8e-35f0a1c2d4e7"]
FS = ["ext4", "xfs", "btrfs"]
