category = "services"
task = [
  "My nightly job (${JOB}.timer) never seems to run. Fix it so it runs every night at ${HH}:${MM}.",
  "${JOB} is supposed to run every night at ${HH}:${MM} but there's never any output. Fix it.",
]

[vars]
JOB = ["backup", "cleanup", "db-dump", "sync-photos", "rotate-reports"]
HH = ["01", "02", "03", "04", "23"]
MM = ["00", "15", "30", "45"]
KIND = ["daily-suffix", "dot", "not-enabled"]
