category = "filesystem"
task = [
  "Since this morning, programs run by my user ${U_NAME} fail with 'Permission denied' when they write temporary files. root is fine. Fix it.",
  "${U_NAME}'s builds fail with 'mkstemp: Permission denied', but they work as root. Fix it.",
]

[vars]
U = "@users"
DIR = ["/tmp", "/var/tmp"]
MODE = ["755", "700", "1755", "775"]
