category = "services"
task = [
  "${SVC_NAME}.service won't start. Fix it.",
  "The ${SVC_DESC} on port ${SVC_PORT} is down; systemd says ${SVC_NAME}.service failed. Fix it.",
  "I wrote a unit for my ${SVC_DESC} (${SVC_NAME}.service) but it never comes up. Help.",
]

[vars]
SVC = "@services"
BAD = ["/usr/bin/pyhton3", "/usr/bin/python3.8", "/usr/local/bin/python3", "/usr/bin/pytohn3"]
RESTART = ["Restart=on-failure", ""]
