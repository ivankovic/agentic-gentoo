[package]
name = "mmm"
version = "0.1.0"
edition = "2024"
description = "Marko's Mail Machine: a terminal mail reader over notmuch"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
html2text = { version = "0.17.3", default-features = false }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
