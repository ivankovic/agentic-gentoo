[package]
name = "deck"
version = "0.1.0"
edition = "2024"
description = "Installed Gentoo packages, where they came from, local patches and their way upstream"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
ratatui = "0.30"
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
lto = "thin"
